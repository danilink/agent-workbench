# --- Play ---------------------------------------------------------------------
# Dev-only default; set APPLICATION_SECRET anywhere that is not your laptop.
play.http.secret.key = "dev-only-secret-change-me-dev-only-secret-change-me"
play.http.secret.key = ${?APPLICATION_SECRET}

# The SPA is served by Vite in dev and proxies /api to Play.
play.filters.hosts.allowed = ["localhost", "127.0.0.1"]

# The SPA sends this header on every call (frontend/src/api/client.ts). Browsers cannot attach a custom header
# cross-origin without a CORS preflight, and CORS is not enabled, so its presence proves a same-origin caller.
# Play 3 ships with no bypass headers, so without this any request carrying cookies fails the CSRF check.
play.filters.csrf.header.bypassHeaders {
  X-Requested-With = "*"
}

# --- Database -----------------------------------------------------------------
db.default.driver = org.postgresql.Driver
db.default.url = "jdbc:postgresql://localhost:5432/workbench"
db.default.url = ${?DATABASE_URL}
db.default.username = workbench
db.default.username = ${?DATABASE_USER}
db.default.password = workbench
db.default.password = ${?DATABASE_PASSWORD}
play.evolutions.db.default.autoApply = true

# Blocking JDBC calls run here, never on Play's default dispatcher.
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor.fixed-pool-size = 8
}

# A running run holds 3 threads (supervisor + stdout + stderr readers); a queued one holds 1 while it waits.
agent-runs-dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor.fixed-pool-size = 16
}

# Stopping (or a dev-mode reload) cancels live runs and waits for them to die: cancel-grace plus margin.
# Pekko's default of 5s per phase would cut that short and leave agent processes orphaned.
pekko.coordinated-shutdown.phases.service-stop.timeout = 30 seconds

# --- Workbench ----------------------------------------------------------------
workbench {
  # Absolute paths of the git repositories agents are allowed to work on.
  # Anything not listed here is rejected by the API.
  # The env var WORKBENCH_REPOS (comma-separated) is appended to this list.
  repos = []

  worktree-root = ${user.home}"/.agent-workbench/worktrees"
  worktree-root = ${?WORKBENCH_WORKTREE_ROOT}

  # How many agent sessions may run at the same time. Extra runs stay Queued.
  max-parallel-runs = 3

  # Hard wall-clock cap per run. The CLI enforces the turn and budget caps itself, but a hung CLI spends
  # neither, so this is what guarantees that every run ends and gives its slot back.
  max-run-duration = 30 minutes
  max-run-duration = ${?WORKBENCH_MAX_RUN_DURATION}

  # After asking an agent to stop (SIGINT), how long to wait before force-killing it and every process it started.
  cancel-grace = 10 seconds

  # "claude" runs the real CLI; "fake" replays a scripted session (no cost, for demos/tests).
  runner = "claude"
  runner = ${?WORKBENCH_RUNNER}

  claude {
    binary = "claude"
    # Point at a script to exercise the real runner without spending tokens.
    binary = ${?WORKBENCH_CLAUDE_BINARY}
    permission-mode = "acceptEdits"
    allowed-tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash(sbt *)", "Bash(npm *)", "Bash(git status *)", "Bash(git diff *)"]
    max-turns = 40
    max-budget-usd = 2.0
    # Appended verbatim, e.g. ["--bare"] or ["--model", "sonnet"].
    extra-args = []
  }
}
